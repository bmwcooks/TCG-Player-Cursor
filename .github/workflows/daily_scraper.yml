name: Daily TCGPlayer Scraper

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (5 AM PDT)
  workflow_dispatch: # Allows you to run the action manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[all]>=0.4.2" beautifulsoup4 requests
          patchright install
          npx playwright install-deps

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u scraper.py

      - name: Commit tracker data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker_data.json data/chart_history.json data/latest_sales.json
          if git diff --staged --quiet; then
            echo "No tracker data changes to commit."
          else
            git commit -m "chore: update tracker data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/*.json _site/data/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
