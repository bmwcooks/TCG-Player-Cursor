name: Daily TCGPlayer Scraper

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (5 AM PDT)
  workflow_dispatch: # Allows you to run the action manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[all]>=0.4.2" beautifulsoup4 gspread google-auth requests
          scrapling install --force
          npx playwright install-deps

      - name: Run Scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper.py
